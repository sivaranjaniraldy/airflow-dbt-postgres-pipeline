 name: dbt Tests on: [push, pull_request] jobs: test: runs-on: ubuntu-latest services: postgres: image: postgres:15 env: POSTGRES_USER: warehouse POSTGRES_PASSWORD: warehouse POSTGRES_DB: olist ports: ['5432:5432'] options: >- --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: '3.12' - run: pip install dbt-core dbt-postgres - name: Run dbt tests working-directory: dbt_project/olist_analytics run: | mkdir -p ~/.dbt cp ../profiles.yml.example ~/.dbt/profiles.yml dbt deps || true dbt test --profiles-dir ~/.dbt 